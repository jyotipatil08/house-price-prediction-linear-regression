 <br>

<script type="text/javascript">
  
  function validate()
  {
    if(document.getElementById('Pregnancies').value != '')
    {
      if(document.getElementById('Glucose').value != '')
      {
          if(document.getElementById('BloodPressure').value != '')
          {
              if(document.getElementById('SkinThickness').value != '')
              {      
                  if(document.getElementById('Insulin').value != '')
                  {
                      if(document.getElementById('BMI').value != '')
                      {
                          if(document.getElementById('Diabetespedigree').value != '')
                          {
                              if(document.getElementById('Age').value != '')
                              {

                                RecommFunction();
                                return true;
                              }
                              else
                              {
                              alert("Please enter Age");
                              return false;
                              }
                          }
                          else
                          {
                          alert("Please enter Diabetes Pedigree");
                          return false;
                          }                             
                      }
                      else
                      {
                      alert("Please enter BMI");
                      return false;
                      }
                  }
                  else
                  {
                  alert("Please  enter Insulin");
                  return false;
                  }                                                   
              }
              else
              {
              alert("Please enter SkinThickness");
              return false;
              }
          }
          else
          {
          alert("Please enter BloodPressure");
          return false;
          }
      }
      else
      {
      alert("Please enter Glucose");
      return false;
      }
    }
    else
    {
    alert("Please  enter Pregnancies");
    return false;
    }
      
}



function RecommFunction()
  {
      var Pregnancies = $('#Pregnancies').val();
      var Glucose = $('#Glucose').val();         
      var BloodPressure = $('#BloodPressure').val();
      var SkinThickness = $('#SkinThickness').val();         
      var Insulin = $('#Insulin').val();
      var BMI = $('#BMI').val();         
      var Diabetespedigree = $('#Diabetespedigree').val();
      var Age = $('#Age').val();         
      
                      
    

      $.ajax({
          type: "POST",
              url: '{% url 'get_response_DiabetesTest' %}',
              data: {

                  'Pregnancies' : Pregnancies,
                  'Glucose': Glucose,
                  'BloodPressure': BloodPressure,
                  'SkinThickness' : SkinThickness,
                  'Insulin' : Insulin,
                  'BMI' : BMI,
                  'Diabetespedigree': Diabetespedigree,
                  'Age' : Age,
                  
                  'csrfmiddlewaretoken': '{{ csrf_token }}',

              },



              //dataType: 'json',
              success: function (data) {
                document.getElementById('resultdiv').style.display="block";
                document.getElementById('result').innerHTML = data["respond"];

                if (document.getElementById('result').innerHTML == 'HIGH') 
                {
                  document.getElementById('result').style.color = "red";
                  document.getElementById('docdiv').style.display="block";
                } 
                else if (document.getElementById('result').innerHTML == 'MEDIUM') 
                {
                  document.getElementById('result').style.color = "orange";
                }
                else if (document.getElementById('result').innerHTML == 'LOW') 
                {
                  document.getElementById('result').style.color = "green";
                }

                

              }
              })
  }


</script>
